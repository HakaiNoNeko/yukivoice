name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Pushing a tag vX.Y.Z builds both targets and attaches them to the GitHub release
# of the same name (create the release first: `gh release create vX.Y.Z`).
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (Qt xcb plugin deps + libxcb-cursor to bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libpulse0 libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-build.txt
      - name: Build AppImage
        run: PY=python packaging/build_appimage.sh
      - name: Smoke test (UI constructs, model downloads, speech is produced)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./dist/YukiVoice-x86_64.AppImage --selftest --download standard --out selftest-linux.json
      - if: always()
        run: cat selftest-linux.json || true
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/YukiVoice-x86_64.AppImage --clobber
      - uses: actions/upload-artifact@v4
        if: always() && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true   # the account's artifact quota can be exhausted
        with:
          name: YukiVoice-linux
          path: |
            dist/YukiVoice-x86_64.AppImage
            selftest-linux.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-build.txt
      - name: Build exe
        run: |
          python packaging/make_icons.py
          python -m PyInstaller packaging/yukivoice.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test (UI constructs, model downloads, speech is produced)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\YukiVoice.exe -ArgumentList "--selftest","--download","standard","--out","selftest-windows.json" -Wait -PassThru
          if (Test-Path selftest-windows.json) { Get-Content selftest-windows.json }
          exit $p.ExitCode
      - if: always()
        shell: pwsh
        run: if (Test-Path selftest-windows.json) { Get-Content selftest-windows.json }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/YukiVoice.exe --clobber
      - uses: actions/upload-artifact@v4
        if: always() && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          name: YukiVoice-windows
          path: |
            dist/YukiVoice.exe
            selftest-windows.json
